name: Platform Runtime

on:
  workflow_dispatch:
  schedule:
    - cron: '31 4 * * 1'

permissions:
  contents: read

concurrency:
  group: platform-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.3

jobs:
  android:
    name: Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Create and start Android emulator
        shell: bash
        run: |
          sdkmanager "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          printf 'no\n' | avdmanager create avd --force --name cosyncing-ci --package "system-images;android-35;google_apis;x86_64"
          "$ANDROID_HOME/emulator/emulator" -avd cosyncing-ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect &
          adb wait-for-device
          timeout 300 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 2; done'
          adb shell input keyevent 82
      - run: flutter test integration_test/adaptive_shell_test.dart -d emulator-5554

  apple:
    name: ${{ matrix.target }} runtime
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/client
    strategy:
      fail-fast: false
      matrix:
        target: [macos, ios]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run macOS integration test
        if: matrix.target == 'macos'
        run: flutter test integration_test/adaptive_shell_test.dart -d macos
      - name: Run iOS simulator integration test
        if: matrix.target == 'ios'
        shell: bash
        run: |
          DEVICE_ID="$(xcrun simctl list devices available | sed -n 's/.*iPhone.*(\([0-9A-F-]\{36\}\)).*/\1/p' | head -n 1)"
          test -n "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          open -a Simulator --args -CurrentDeviceUDID "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          flutter test integration_test/adaptive_shell_test.dart -d "$DEVICE_ID"
