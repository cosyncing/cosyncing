name: Promote Accepted Client Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact client prerelease tag to promote
        required: true
        type: string
      confirm:
        description: Type PROMOTE after physical acceptance
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: client-stable-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: validate and promote accepted client assets
    if: ${{ inputs.confirm == 'PROMOTE' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: client-production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - name: Require exact candidate identity and assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          test "$TAG" = "client-v$version"
          test "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)"
          gh release view "$TAG" --json isDraft,isPrerelease,tagName > "$RUNNER_TEMP/release.json"
          jq -e --arg tag "$TAG" '.isDraft == false and .isPrerelease == true and .tagName == $tag' "$RUNNER_TEMP/release.json"
          mkdir dist
          gh release download "$TAG" --dir dist
          expected="$(cat <<EOF
          SHA256SUMS
          cosyncing-client-$version-android.apk
          cosyncing-client-$version-linux-x64.tar.gz
          cosyncing-client-$version-macos-arm64-unsigned.dmg
          cosyncing-client-$version-windows-x64-unsigned.zip
          EOF
          )"
          actual="$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)"
          test "$actual" = "$expected"
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Promote without rebuilding or replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#client-v}"
          gh release edit "$TAG" --prerelease=false --latest \
            --title "cosyncing client $version"
