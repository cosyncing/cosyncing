name: Stage Broker Release Candidate

on:
  push:
    tags: ['broker-v*.*.*']

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}

concurrency:
  group: broker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: release contract gate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.3
          channel: stable
          cache: true
      - name: Install hosted verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          npx --yes playwright@1.61.1 install --with-deps chromium-headless-shell
      - run: bun install --frozen-lockfile
      - name: Require an exact clean broker version tag
        shell: bash
        run: |
          VERSION="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          test "$GITHUB_REF_NAME" = "broker-v$VERSION"
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$GITHUB_REPOSITORY" = cosyncing/cosyncing
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: bun run check

  prepare-draft:
    needs: gate
    name: prepare empty draft release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create or reset the matching draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft,tagName >/tmp/release.json 2>/dev/null; then
            test "$(jq -r .isDraft /tmp/release.json)" = true
            test "$(jq -r .tagName /tmp/release.json)" = "$GITHUB_REF_NAME"
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' |
              while IFS= read -r asset; do gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes; done
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --latest=false \
              --title "cosyncing $GITHUB_REF_NAME release candidate (staging)" \
              --notes "Unpublished staging release. Only the verified candidate is published."
          fi

  javascript-package:
    needs: prepare-draft
    name: universal JavaScript application
    environment: broker-release-candidate
    permissions:
      contents: write
    # One bundle serves every host, so this job has no matrix and no runner/target correspondence to keep.
    # It is not the npm artifact: the same builder stamps `bootstrap-js` here, which is what makes the
    # installed files cosyncing's own to replace rather than a package manager's.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - name: Load public release trust material
        env:
          RELEASE_PUBLIC_KEY_B64: ${{ secrets.COSYNCING_RELEASE_PUBLIC_KEY_PEM_B64 }}
          RELEASE_KEY_ID: ${{ vars.COSYNCING_RELEASE_KEY_ID }}
        shell: bash
        run: |
          test -n "$RELEASE_PUBLIC_KEY_B64"
          test -n "$RELEASE_KEY_ID"
          printf '%s' "$RELEASE_PUBLIC_KEY_B64" | base64 --decode > "$RUNNER_TEMP/cosyncing-release.pub.pem"
      - name: Build, prove, and stage the JavaScript application
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KEY_ID: ${{ vars.COSYNCING_RELEASE_KEY_ID }}
        shell: bash
        run: |
          COMMIT="$(git rev-parse HEAD)"
          BUILD_DATE="$(date -u -d "@$(git show -s --format=%ct HEAD)" +%Y-%m-%dT%H:%M:%S.000Z)"
          VERSION="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          BASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/broker-v$VERSION"
          CHANNEL_URL="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/release-manifest.json"
          mkdir -p output/js
          bun run scripts/broker/build-broker-bundle.ts \
            --outfile output/js/cosyncing-app.js \
            --distribution bootstrap-js \
            --commit "$COMMIT" --build-date "$BUILD_DATE" \
            --release-manifest-url "$BASE_URL/release-manifest.json" \
            --release-channel-manifest-url "$CHANNEL_URL" \
            --release-key-id "$RELEASE_KEY_ID" \
            --release-public-key "$RUNNER_TEMP/cosyncing-release.pub.pem" \
            --require-clean --minify
          bun run scripts/broker/release/package-evidence.ts \
            --artifact output/js/cosyncing-app.js \
            --output output/js/cosyncing-app.js.evidence.json \
            --target universal --version "$VERSION" \
            --commit "$COMMIT" --build-date "$BUILD_DATE"
          gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' | grep -qx true
          gh release upload "$GITHUB_REF_NAME" output/js/cosyncing-app.js output/js/cosyncing-app.js.evidence.json --clobber

  web-package:
    needs: prepare-draft
    name: canonical /cosy/ web sidecar
    environment: broker-release-candidate
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.3
          channel: stable
          cache: true
      - run: bun install --frozen-lockfile
      - run: flutter pub get
        working-directory: apps/client
      - name: Build, prove, and stage the web half of the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          COMMIT="$(git rev-parse HEAD)"
          BUILD_DATE="$(date -u -d "@$(git show -s --format=%ct HEAD)" +%Y-%m-%dT%H:%M:%S.000Z)"
          VERSION="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          mkdir -p output/web
          bun run client:build:web
          bun run release:package-web -- \
            --build-dir apps/client/build/web \
            --artifact output/web/cosyncing-web-app.tar.gz \
            --evidence output/web/cosyncing-web-app.tar.gz.evidence.json \
            --version "$VERSION" --commit "$COMMIT" --build-date "$BUILD_DATE"
          gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' | grep -qx true
          gh release upload "$GITHUB_REF_NAME" output/web/cosyncing-web-app.tar.gz output/web/cosyncing-web-app.tar.gz.evidence.json --clobber

  candidate:
    needs: [javascript-package, web-package]
    name: assemble, verify, and publish prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: broker-release-candidate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - name: Download exact draft staging inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' | grep -qx true
          mkdir -p output/staging
          gh release download "$GITHUB_REF_NAME" --dir output/staging
          bun run scripts/broker/release/verify-staging-assets.ts output/staging
      - name: Install canonical parity browser
        run: npx --yes playwright@1.61.1 install --with-deps chromium-headless-shell
      - name: Prove the downloaded broker/web candidate pair
        shell: bash
        run: |
          COMMIT="$(git rev-parse HEAD)"
          VERSION="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          mkdir -p output/web-pair
          tar -xzf output/staging/cosyncing-web-app.tar.gz -C output/web-pair
          bun run release:verify-pair -- \
            --broker output/staging/cosyncing-app.js --bun "$(command -v bun)" \
            --web-dir output/web-pair/app \
            --commit "$COMMIT" --version "$VERSION"
      # The desktop clients the all-in-one installer places, taken from the matching client release rather
      # than rebuilt here. That release is already published and physically accepted by the time a broker
      # release runs — the client-first rollout order in docs/release/client-distribution.md requires it —
      # so these are the exact bytes a user downloading the client by hand would get, carried into the
      # broker release so one command can install both. Only the desktop hosts: Android installs from its
      # own APK, and no installer places it.
      - name: Collect the matching desktop clients
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          test "$(git rev-parse "client-v$VERSION^{commit}")" = "$(git rev-parse HEAD)"
          gh release view "client-v$VERSION" --json isDraft,isPrerelease,tagName > "$RUNNER_TEMP/client-release.json"
          jq -e --arg tag "client-v$VERSION" '.isDraft == false and .isPrerelease == false and .tagName == $tag' "$RUNNER_TEMP/client-release.json"
          mkdir -p output/clients
          gh release download "client-v$VERSION" --dir output/clients \
            --pattern "cosyncing-client-$VERSION-linux-x64.tar.gz" \
            --pattern "cosyncing-client-$VERSION-macos-arm64-unsigned.zip" \
            --pattern "cosyncing-client-$VERSION-windows-x64-unsigned.zip" \
            --pattern 'SHA256SUMS'
          # The client release signs nothing, but it does publish a checksum list over its own assets.
          # Checking the downloads against it here means a client that changed after acceptance cannot
          # ride into a signed broker release.
          (cd output/clients && grep -F -e "-linux-x64.tar.gz" -e "-macos-arm64-unsigned.zip" \
            -e "-windows-x64-unsigned.zip" SHA256SUMS > expected.sha256 \
            && sha256sum --check expected.sha256)
          rm -f output/clients/SHA256SUMS output/clients/expected.sha256
      - name: Assemble and verify signed release
        env:
          RELEASE_PRIVATE_KEY_B64: ${{ secrets.COSYNCING_RELEASE_PRIVATE_KEY_PEM_B64 }}
          RELEASE_PUBLIC_KEY_B64: ${{ secrets.COSYNCING_RELEASE_PUBLIC_KEY_PEM_B64 }}
          RELEASE_P256_PRIVATE_KEY_B64: ${{ secrets.COSYNCING_RELEASE_P256_PRIVATE_KEY_PEM_B64 }}
          RELEASE_P256_PUBLIC_KEY_B64: ${{ secrets.COSYNCING_RELEASE_P256_PUBLIC_KEY_PEM_B64 }}
          RELEASE_KEY_ID: ${{ vars.COSYNCING_RELEASE_KEY_ID }}
        shell: bash
        run: |
          test -n "$RELEASE_PRIVATE_KEY_B64"
          test -n "$RELEASE_PUBLIC_KEY_B64"
          test -n "$RELEASE_P256_PRIVATE_KEY_B64"
          test -n "$RELEASE_P256_PUBLIC_KEY_B64"
          printf '%s' "$RELEASE_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/cosyncing-release.key.pem"
          printf '%s' "$RELEASE_PUBLIC_KEY_B64" | base64 --decode > "$RUNNER_TEMP/cosyncing-release.pub.pem"
          printf '%s' "$RELEASE_P256_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/cosyncing-release-p256.key.pem"
          printf '%s' "$RELEASE_P256_PUBLIC_KEY_B64" | base64 --decode > "$RUNNER_TEMP/cosyncing-release-p256.pub.pem"
          chmod 600 "$RUNNER_TEMP/cosyncing-release.key.pem"
          chmod 600 "$RUNNER_TEMP/cosyncing-release-p256.key.pem"
          COMMIT="$(git rev-parse HEAD)"
          BUILD_DATE="$(date -u -d "@$(git show -s --format=%ct HEAD)" +%Y-%m-%dT%H:%M:%S.000Z)"
          VERSION="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          BASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/broker-v$VERSION"
          mkdir -p output/release
          bun run release:assemble -- \
            --artifacts output/staging --evidence output/staging --clients output/clients \
            --output output/release \
            --base-url "$BASE_URL" --commit "$COMMIT" --published-at "$BUILD_DATE" \
            --key-id "$RELEASE_KEY_ID" \
            --private-key "$RUNNER_TEMP/cosyncing-release.key.pem" \
            --public-key "$RUNNER_TEMP/cosyncing-release.pub.pem" \
            --p256-private-key "$RUNNER_TEMP/cosyncing-release-p256.key.pem" \
            --p256-public-key "$RUNNER_TEMP/cosyncing-release-p256.pub.pem"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/cosyncing-release.pub.pem" -rawin \
            -in output/release/release-manifest.json -sigfile output/release/release-manifest.json.sig
          # The DER sibling is what the shell installer verifies on macOS, and openssl reads it directly.
          for payload in release-manifest.json SHA256SUMS; do
            openssl dgst -sha256 -verify "$RUNNER_TEMP/cosyncing-release-p256.pub.pem" \
              -signature "output/release/$payload.p256.der.sig" "output/release/$payload"
          done
          # openssl cannot check the P1363 sibling: it is raw r||s, the layout .NET reads, and openssl
          # expects a DER SEQUENCE. bun is already on this runner and verifies it directly. Both encodings
          # are checked because a release that published only one working encoding would break exactly one
          # of the two installers, on hosts neither CI job runs on.
          bun -e '
            const { createPublicKey, verify } = await import("node:crypto");
            const key = createPublicKey(await Bun.file(`${process.env.RUNNER_TEMP}/cosyncing-release-p256.pub.pem`).text());
            for (const payload of ["release-manifest.json", "SHA256SUMS"]) {
              const bytes = Buffer.from(await Bun.file(`output/release/${payload}`).arrayBuffer());
              const signature = Buffer.from(await Bun.file(`output/release/${payload}.p256.sig`).arrayBuffer());
              if (!verify("sha256", bytes, { key, dsaEncoding: "ieee-p1363" }, signature)) {
                console.error(`P-256 sibling signature failed for ${payload}`);
                process.exit(1);
              }
            }
          '
          cmp "$RUNNER_TEMP/cosyncing-release-p256.pub.pem" output/release/release-key-p256.pem
          (cd output/release && sha256sum --check SHA256SUMS)
      - name: Replace staging assets only after remote candidate verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/staged.txt"
          while IFS= read -r asset; do gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes; done < "$RUNNER_TEMP/staged.txt"
          gh release upload "$GITHUB_REF_NAME" output/release/*
          mkdir -p output/published
          gh release download "$GITHUB_REF_NAME" --dir output/published
          bun run scripts/broker/release/verify-promotion-assets.ts --candidate output/published \
            --version "$(bun -e 'console.log((await Bun.file("package.json").json()).version)')" --commit "$(git rev-parse HEAD)"
          (cd output/release && sha256sum * | sort) > "$RUNNER_TEMP/local.sha256"
          (cd output/published && sha256sum * | sort) > "$RUNNER_TEMP/remote.sha256"
          cmp "$RUNNER_TEMP/local.sha256" "$RUNNER_TEMP/remote.sha256"
          gh release edit "$GITHUB_REF_NAME" --verify-tag --draft=false --prerelease=true --latest=false \
            --title "cosyncing $GITHUB_REF_NAME release candidate"
