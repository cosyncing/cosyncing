name: Promote Accepted Broker Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact broker prerelease tag to promote
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: broker-stable-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: validate evidence and promote stable
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: broker-production
    permissions:
      contents: write
    steps:
      - name: Require explicit reviewed binary-distribution approval
        env:
          BINARY_RELEASE_LEGAL_APPROVED: ${{ vars.COSYNCING_BINARY_RELEASE_LEGAL_APPROVED }}
        shell: bash
        run: |
          test "$BINARY_RELEASE_LEGAL_APPROVED" = true || {
            echo "Compiled broker distribution remains blocked; see docs/legal/binary-distribution-readiness.md" >&2
            exit 1
          }
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - name: Require exact prerelease identity
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          VERSION="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          test "$TAG" = "broker-v$VERSION"
          test "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)"
          gh release view "$TAG" --json isDraft,isPrerelease,tagName > "$RUNNER_TEMP/release.json"
          jq -e --arg tag "$TAG" '.isDraft == false and .isPrerelease == true and .tagName == $tag' "$RUNNER_TEMP/release.json"
      - name: Download and verify the complete candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_PUBLIC_KEY_B64: ${{ secrets.COSYNCING_RELEASE_PUBLIC_KEY_PEM_B64 }}
        shell: bash
        run: |
          test -n "$RELEASE_PUBLIC_KEY_B64"
          printf '%s' "$RELEASE_PUBLIC_KEY_B64" | base64 --decode > "$RUNNER_TEMP/cosyncing-release.pub.pem"
          mkdir -p output/promotion
          gh release download "$TAG" --dir output/promotion
          cmp "$RUNNER_TEMP/cosyncing-release.pub.pem" output/promotion/release-key.pem
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/cosyncing-release.pub.pem" -rawin \
            -in output/promotion/release-manifest.json -sigfile output/promotion/release-manifest.json.sig
          (cd output/promotion && sha256sum --check SHA256SUMS)
          bun run scripts/broker/release/verify-promotion-assets.ts output/promotion
      - name: Promote without changing assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --prerelease=false --latest
