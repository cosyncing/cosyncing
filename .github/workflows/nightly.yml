name: Nightly

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extended:
    name: extended deterministic validation
    if: github.repository == 'cosyncing/cosyncing'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.3
          channel: stable
          cache: true
      - name: Install hosted verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          npx --yes playwright@1.61.1 install --with-deps chromium-headless-shell
      - run: bun install --frozen-lockfile
      - run: bun run check
