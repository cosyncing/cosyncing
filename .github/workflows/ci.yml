name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.8
  FLUTTER_VERSION: 3.44.3

jobs:
  current-host:
    name: current-host release verification
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install hosted verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          npx --yes playwright@1.61.1 install --with-deps chromium-headless-shell
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Preserve repository-check evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: repository-check-${{ github.run_id }}
          path: output/check
          if-no-files-found: warn
          retention-days: 7

  linux-android:
    name: ${{ matrix.target }} build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/client
    strategy:
      fail-fast: false
      matrix:
        target: [linux, android]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux desktop build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev
      - run: flutter pub get
      - if: matrix.target == 'linux'
        run: flutter build linux --debug
      - if: matrix.target == 'android'
        run: flutter build apk --debug

  apple:
    name: ${{ matrix.target }} build
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/client
    strategy:
      fail-fast: false
      matrix:
        target: [macos, ios]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - if: matrix.target == 'macos'
        run: flutter build macos --debug
      - if: matrix.target == 'ios'
        run: flutter build ios --simulator --debug

  windows:
    name: Windows build
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --debug

  required:
    name: required
    if: ${{ always() }}
    needs: [current-host, linux-android, apple, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          test "$(jq -r '[.[].result] | all(. == "success")' <<< "$NEEDS_JSON")" = true
