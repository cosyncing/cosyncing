name: Broker Release Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: broker-release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-package:
    name: native package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
            compile-target: bun-linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            compile-target: bun-linux-arm64
          # macOS is built and self-attested on an Apple Silicon runner, so a PR cannot regress the
          # darwin build or its evidence path while this required gate stays green.
          - runner: macos-15
            target: darwin-arm64
            compile-target: bun-darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - name: Derive immutable metadata
        shell: bash
        run: |
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # GNU date takes -d, BSD/macOS date takes -r; the gate runs on both.
          EPOCH="$(git show -s --format=%ct HEAD)"
          echo "BUILD_DATE=$(date -u -d "@$EPOCH" +%Y-%m-%dT%H:%M:%S.000Z 2>/dev/null \
            || date -u -r "$EPOCH" +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"
          echo "VERSION=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')" >> "$GITHUB_ENV"
      - name: Build and prove ephemeral native package
        shell: bash
        run: |
          mkdir -p output/native
          bun run scripts/broker/build-broker.ts \
            --target "${{ matrix.compile-target }}" \
            --outfile "output/native/cosyncing-${{ matrix.target }}" \
            --commit "$COMMIT" --build-date "$BUILD_DATE" \
            --require-clean --minify --no-alias
          bun run scripts/broker/release/package-evidence.ts \
            --artifact "output/native/cosyncing-${{ matrix.target }}" \
            --output "output/native/cosyncing-${{ matrix.target }}.evidence.json" \
            --target "${{ matrix.target }}" --version "$VERSION" \
            --commit "$COMMIT" --build-date "$BUILD_DATE"
          # macOS has shasum, not sha256sum.
          (sha256sum output/native/* 2>/dev/null || shasum -a 256 output/native/*) \
            >> "$GITHUB_STEP_SUMMARY"

  broker-web-pair:
    name: built broker and /app/ parity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.3
          channel: stable
          cache: true
      - run: bun install --frozen-lockfile
      - name: Install canonical parity browser
        run: npx --yes playwright@1.61.1 install --with-deps chromium-headless-shell
      - run: flutter pub get
        working-directory: apps/client
      - name: Build and verify one immutable candidate pair
        shell: bash
        run: |
          COMMIT="$(git rev-parse HEAD)"
          BUILD_DATE="$(date -u -d "@$(git show -s --format=%ct HEAD)" +%Y-%m-%dT%H:%M:%S.000Z)"
          VERSION="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          mkdir -p output/candidate
          bun run scripts/broker/build-broker.ts \
            --target bun-linux-x64 \
            --outfile output/candidate/cosyncing-linux-x64 \
            --commit "$COMMIT" --build-date "$BUILD_DATE" \
            --require-clean --minify --no-alias
          bun run client:build:web
          bun run release:verify-pair -- \
            --broker output/candidate/cosyncing-linux-x64 \
            --web-dir apps/client/build/web \
            --commit "$COMMIT" --version "$VERSION"

  required:
    name: required
    if: ${{ always() }}
    needs: [native-package, broker-web-pair]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every package gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          test "$(jq -r '[.[].result] | all(. == "success")' <<< "$NEEDS_JSON")" = true
