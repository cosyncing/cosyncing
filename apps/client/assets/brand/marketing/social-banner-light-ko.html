<!doctype html>
<html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&display=swap');
    body { margin:0; }
  html, body { height:100%; background:#F2F5F4; }
  .banner { position:relative; width:100vw; height:100vh; overflow:hidden; background:#F2F5F4;
            font-family:'Inter','Noto Sans KR','UnDotum','Baekmuk Dotum',sans-serif; }
  .plane1 { position:absolute; right:-140px; top:-180px; width:660px; height:660px;
            background:rgba(15,118,110,0.12); border-radius:110px; transform:rotate(12deg); }
  .focal { position:absolute; right:120px; top:118px; width:396px; height:396px; }
  .left { position:absolute; left:84px; top:84px; }
  .lock { display:flex; align-items:center; gap:15px; }
  .wm { font-weight:500; letter-spacing:-0.01em; font-size:46px; color:#0B0E14; }
  .sync { color:#0F766E; }
  .headline { margin-top:96px; font-weight:500; font-size:56px; line-height:1.35; color:#0B0E14; letter-spacing:0; }
  .headline .accent { color:#0F766E; }
  .subline { margin-top:30px; font-weight:400; font-size:26px; color:rgba(11,14,20,0.64); letter-spacing:0.02em; }
</style></head><body>
<div class="banner">
  <div class="plane1"></div>
  <img class="focal" src="../source/cosyncing-mark-two-tone-light.svg">
  <div class="left">
    <div class="lock">
      <img src="../source/cosyncing-mark-two-tone-light.svg" style="width:54px;height:54px">
      <span class="wm">co<span class="sync">sync</span>ing</span>
    </div>
    <div class="headline">어디서든 코딩.<br><span class="accent">어디서나 동기화.</span>
    <div class="subline">에이전트는 계속 일하고, 당신은 계속 나아갑니다.</div></div>
  </div>
</div>
</body></html>
