<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; }
  html, body { height:100%; background:#0C1E22; }
  .feat { position:relative; width:100vw; height:100vh; overflow:hidden; background:#0C1E22;
          font-family:'Inter','DejaVu Sans',sans-serif; }
  .plane { position:absolute; right:-170px; top:-190px; width:560px; height:560px;
           background:rgba(45,212,191,0.07); border-radius:80px; transform:rotate(10deg); }
  .center { position:absolute; left:0; right:0; top:128px; text-align:center; }
  .lock { display:inline-flex; align-items:center; gap:16px; }
  .wm { font-weight:500; letter-spacing:-0.01em; font-size:58px; color:#F2F5F4; }
  .sync { color:#2DD4BF; }
  .tag { margin-top:30px; font-size:31px; color:rgba(242,245,244,0.72); }
  .tag .accent { color:#2DD4BF; }
  .support { margin-top:16px; font-size:23px; color:rgba(242,245,244,0.55); }
</style></head><body>
<div class="feat">
  <div class="plane"></div>
  <div class="center">
    <div class="lock">
      <img src="../source/cosyncing-mark-two-tone-dark-teal-leads.svg" style="width:66px;height:66px">
      <span class="wm">co<span class="sync">sync</span>ing</span>
    </div>
    <div class="tag">Code anywhere. <span class="accent">Sync everywhere.</span></div>
    <div class="support">Your agents keep working. You keep moving.</div>
  </div>
</div>
</body></html>
