name: cosyncing_client
description: "Cross-platform client for cosyncing brokers"
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: ^3.12.2

dependencies:
  # Native background download engine (FG8). iOS URLSession background sessions
  # and Android WorkManager keep workspace-file downloads running when the app
  # is backgrounded. See ../../docs/project/implementation-status.md
  # 2026-07-17-fg8-background-downloads.md.
  background_downloader: ^9.5.6
  # Local packages — boundary-only, no implementation yet
  broker_client:
    path: ../../packages/dart/broker_client
  broker_client_flutter:
    path: ../../packages/dart/broker_client_flutter
  broker_contract:
    path: ../../packages/dart/broker_contract
  broker_crypto:
    path: ../../packages/dart/broker_crypto
  cupertino_icons: ^1.0.8
  desktop_drop:
    path: ../../packages/dart/desktop_drop
  desktop_webview_window: ^0.3.0
  dio: ^5.9.2
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^10.3.1
  flutter_timezone: ^5.1.0
  flutter_tts: ^4.2.5
  go_router: ^14.8.1
  intl: any
  mobile_scanner: ^7.2.0
  pasteboard:
    path: ../../packages/dart/pasteboard
  path: ^1.9.1
  path_provider: ^2.1.6
  speech_to_text: ^7.4.0
  sqlite3_flutter_libs: ^0.6.0+eol
  # Opens http(s) links tapped in agent transcripts. Only http/https are ever
  # launched; local paths are never linkified (see transcript_markdown_body).
  url_launcher: ^6.3.1
  web: ^1.1.1
  webview_flutter: ^4.14.0

dev_dependencies:
  build_runner: ^2.15.0
  drift_dev: ^2.34.1+1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true
  generate: true
