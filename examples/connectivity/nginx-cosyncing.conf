# Put this map in the http context if it is not already defined.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Keep these in the http context. Empty keys are not counted, so only the
# named public bootstrap/ticket routes consume the request-rate zone.
map $uri $cosyncing_rate_key {
    default "";
    =/api/health $binary_remote_addr;
    =/api/ws-auth-tickets $binary_remote_addr;
    ~^/api/transport/pairings/[^/]+/accept$ $binary_remote_addr;
    ~^/api/sessions/[^/]+/[^/]+/stream$ $binary_remote_addr;
}
limit_req_zone $cosyncing_rate_key zone=cosyncing_requests:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=cosyncing_connections:10m;

# $uri deliberately omits query strings. Do not replace it with $request_uri:
# artifact signatures and WebSocket tickets are short-lived URL capabilities.
log_format cosyncing_safe '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 443 ssl;
    server_name cosy.example.com;

    # Replace with certificate paths managed by the operator.
    ssl_certificate /etc/ssl/cosy.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/cosy.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 64m;
    client_body_timeout 30s;
    send_timeout 30s;
    limit_req zone=cosyncing_requests burst=20 nodelay;
    limit_conn cosyncing_connections 20;
    access_log /var/log/nginx/cosyncing-access.log cosyncing_safe;

    location = /api/ws-auth-tickets {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:7734;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ~ ^/api/transport/pairings/[^/]+/accept$ {
        client_max_body_size 16k;
        access_log off;
        proxy_pass http://127.0.0.1:7734;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:7734;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

# Teardown: remove the included site, run nginx -t, and reload nginx.
